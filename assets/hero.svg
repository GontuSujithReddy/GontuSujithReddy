<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610" role="img" aria-labelledby="title desc">
<title id="title">Gontu Sujith Reddy — Ideas into useful software.</title>
<desc id="desc">Midnight-blue developer studio with an animated floating three-dimensional robot, orbital rings and a learning, building, contributing pathway. The illustration is decorative.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#060E1D"/><stop offset="1" stop-color="#11253D"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#168CB8" stop-opacity=".38"/><stop offset="1" stop-color="#168CB8" stop-opacity="0"/></radialGradient>
<linearGradient id="metal" x2=".9" y2="1"><stop stop-color="#F1FCFF"/><stop offset=".35" stop-color="#A3D6E7"/><stop offset=".7" stop-color="#4E819E"/><stop offset="1" stop-color="#24445F"/></linearGradient>
<linearGradient id="side" x2="1" y2="1"><stop stop-color="#315575"/><stop offset="1" stop-color="#122B43"/></linearGradient>
<linearGradient id="accent"><stop stop-color="#61E7EB"/><stop offset="1" stop-color="#8AA4FF"/></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#94BCE0" stroke-opacity=".045"/></pattern>
<filter id="shadow" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000917" flood-opacity=".7"/></filter>
<style>
.float{animation:float 6s ease-in-out infinite}.pulse{animation:pulse 3s ease-in-out infinite}.blink{animation:blink 7s infinite;transform-box:fill-box;transform-origin:center}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes blink{0%,42%,46%,100%{transform:scaleY(1)}44%{transform:scaleY(.12)}}
@media(prefers-reduced-motion:reduce){.float,.pulse,.blink{animation:none}}
</style>
</defs>
