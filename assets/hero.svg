<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="gsr-title gsr-desc">
<title id="gsr-title">Gontu Sujith Reddy — Learn. Build. Contribute.</title>
<desc id="gsr-desc">An obsidian developer identity with a floating architectural glass core, blue orbital paths and champagne detailing.</desc>
<defs>
<linearGradient id="gsr-bg" x2="1" y2="1"><stop stop-color="#06090F"/><stop offset=".55" stop-color="#0B1421"/><stop offset="1" stop-color="#101D2B"/></linearGradient>
<radialGradient id="gsr-halo"><stop stop-color="#388CC0" stop-opacity=".27"/><stop offset="1" stop-color="#388CC0" stop-opacity="0"/></radialGradient>
<linearGradient id="gsr-top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EAF8FF"/><stop offset=".45" stop-color="#91C8E5"/><stop offset="1" stop-color="#32688A"/></linearGradient>
<linearGradient id="gsr-l" x2="1" y2="1"><stop stop-color="#173C58"/><stop offset="1" stop-color="#081520"/></linearGradient>
<linearGradient id="gsr-r" x2="1" y2="0"><stop stop-color="#234862"/><stop offset="1" stop-color="#102434"/></linearGradient>
