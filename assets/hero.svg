<g font-family="Arial,Helvetica,sans-serif">
<text x="62" y="550" fill="#6BE2E8" font-size="12" letter-spacing="2">01 / LEARN DEEPLY</text>
<text x="62" y="575" fill="#829DB6" font-size="14">Fundamentals that last.</text>
<text x="532" y="550" fill="#91B6FF" font-size="12" letter-spacing="2">02 / BUILD WITH PURPOSE</text>
<text x="532" y="575" fill="#829DB6" font-size="14">Projects grounded in real needs.</text>
<text x="1010" y="550" fill="#B1A7F2" font-size="12" letter-spacing="2">03 / CONTRIBUTE WITH CARE</text>
<text x="1010" y="575" fill="#829DB6" font-size="14">Better software, together.</text>
