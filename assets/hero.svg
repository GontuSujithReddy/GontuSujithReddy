<text x="60" y="215" fill="#F4FAFF" font-size="68" font-weight="700" letter-spacing="-2">Gontu Sujith</text>
<text x="60" y="291" fill="#F4FAFF" font-size="76" font-weight="700" letter-spacing="-2">Reddy<tspan fill="#61E7EB">.</tspan></text>
<text x="64" y="347" fill="#BDD0E1" font-size="27">Ideas into useful software.</text>
<text x="64" y="386" fill="#8FA9C1" font-size="20">Curiosity in the process. Purpose in the product.</text>
