<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190"><title>Build with purpose. Learn with consistency. Contribute with care.</title><defs><linearGradient id="foot-bg"><stop stop-color="#080D15"/><stop offset="1" stop-color="#142738"/></linearGradient><linearGradient id="foot-light"><stop stop-color="#9BD2F0" stop-opacity="0"/><stop offset=".5" stop-color="#9BD2F0"/><stop offset="1" stop-color="#CDB785" stop-opacity="0"/></linearGradient></defs><style>@keyframes float{0%,100%{transform:translate(1100px,85px)}50%{transform:translate(1100px,69px)}}@keyframes sweep{to{stroke-dashoffset:-1124}}@keyframes shadow{0%,100%{rx:30;opacity:.24}50%{rx:22;opacity:.12}}.cube{animation:float 4s ease-in-out infinite}.trail{animation:sweep 7s linear infinite}.shadow{animation:shadow 4s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.cube,.trail,.shadow{animation:none}}</style><rect width="1200" height="190" rx="18" fill="url(#foot-bg)"/><path d="M38 35H1162M38 155H1162" stroke="#294153"/><path class="trail" d="M38 35H1162" stroke="#9BD2F0" opacity=".75" stroke-width="2" stroke-dasharray="130 994"/><path class="trail" d="M1162 155H38" stroke="#CDB785" opacity=".55" stroke-width="2" stroke-dasharray="90 1034"/><text x="55" y="80" font-family="monospace" font-size="12" fill="#CDB785" letter-spacing="3">THE NEXT CHAPTER IS BUILT, ONE COMMIT AT A TIME.</text><text x="55" y="120" font-family="Arial,sans-serif" font-size="26" fill="#E4EDF4">Build with purpose. Learn with consistency. Contribute with care.</text><ellipse class="shadow" cx="1100" cy="146" rx="30" ry="5" fill="#9BD2F0" opacity=".24"/><g class="cube" transform="translate(1100 85)"><path d="M0-23 35-4 0 15-35-4Z" fill="#AACFE2"/><path d="M-35-4 0 15V52L-35 33Z" fill="#16394F" stroke="#47738C"/><path d="M0 15 35-4V33L0 52Z" fill="#244E67" stroke="#648DA4"/><path d="M0 15V52" stroke="#CDB785"/></g></svg>
