<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
<title id="title">Contribution journey — Gontu Sujith Reddy</title><desc id="desc">Historical snapshot from 1 November 2026: August 1, September 17, October 26, November 1 only 11. Total 55 contributions across 13 active days. Animated line drawing and decorative light particles; values are not live.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171d2b"/><stop offset="1" stop-color="#090e17"/></linearGradient>
<linearGradient id="accent"><stop stop-color="#5de8c0"/><stop offset=".52" stop-color="#83baff"/><stop offset="1" stop-color="#d6a9ff"/></linearGradient>
<linearGradient id="area" x2="0" y2="1"><stop stop-color="#91a9ff" stop-opacity=".26"/><stop offset="1" stop-color="#5de8c0" stop-opacity=".015"/></linearGradient>
<radialGradient id="orb"><stop stop-color="#7351a7" stop-opacity=".23"/><stop offset="1" stop-color="#7351a7" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
<style>
text{font-family:Arial,Helvetica,sans-serif}
.trace{stroke-dasharray:1;animation:draw 14s ease-in-out infinite}
.fill{animation:fill 14s ease-in-out infinite}
.halo{transform-box:fill-box;transform-origin:center;animation:pulse 5s ease-in-out infinite}
.h1{animation-delay:1s}.h2{animation-delay:2s}.h3{animation-delay:3s}
.spark{animation:spark 14s ease-in-out infinite}
.star{animation:twinkle 6s ease-in-out infinite}
@keyframes draw{0%,7%{stroke-dashoffset:1;opacity:0}9%{opacity:1}38%,89%{stroke-dashoffset:0;opacity:1}98%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes fill{0%,12%{opacity:.25}38%,89%{opacity:1}98%,100%{opacity:.25}}
@keyframes pulse{0%,100%{transform:scale(.85);opacity:.16}50%{transform:scale(1.35);opacity:.45}}
@keyframes spark{0%,8%,45%,100%{opacity:0}12%,36%{opacity:1}}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:.75}}
@media(prefers-reduced-motion:reduce){.trace,.fill,.halo,.star{animation:none}.trace{stroke-dashoffset:0}.spark{display:none}}
</style></defs>
