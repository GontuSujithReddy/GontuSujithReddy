<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
<title id="title">Activity in motion — contribution snapshot</title><desc id="desc">55 contributions, 13 active days. August 1, September 17, October 26, November 1 only 11. Snapshot 1 November 2026, not live. The contribution line draws from left to right, holds, and repeats every ten seconds.</desc>
<defs>
<linearGradient id="bg"><stop stop-color="#201d26"/><stop offset="1" stop-color="#11131c"/></linearGradient>
<linearGradient id="line"><stop stop-color="#ffb567"/><stop offset=".5" stop-color="#ff7878"/><stop offset="1" stop-color="#c99bff"/></linearGradient>
<linearGradient id="area" x2="0" y2="1"><stop stop-color="#ff9573" stop-opacity=".23"/><stop offset="1" stop-color="#ff9573" stop-opacity="0"/></linearGradient>
<clipPath id="draw"><rect x="430" y="130" width="600" height="260"><animate attributeName="width" values="0;0;600;600;0;0" keyTimes="0;.08;.5;.91;.96;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
